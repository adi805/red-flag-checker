<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Red Flag Checker - A fun Valentine's Day quiz to check relationship red flags. Available in English & Indonesian." />
    <meta name="keywords" content="red flag checker, relationship quiz, valentine's day, love test, toxic relationship" />
    <meta name="author" content="Built with TRAE AI" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Red Flag Checker - Valentine's Edition" />
    <meta property="og:description" content="Is your date a red flag? Find out with this brutally honest quiz! 🚩" />
    <meta property="og:image" content="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=A%20modern%20red%20flag%20checker%20app%20interface%20with%20valentine%27s%20theme%2C%20pink%20and%20red%20colors%2C%20heart%20icons%2C%20and%20playful%20design%20on%20a%20gradient%20background&image_size=square" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Red Flag Checker - Valentine's Edition" />
    <meta name="twitter:description" content="Is your date a red flag? Find out with this brutally honest quiz! 🚩" />
    <meta name="twitter:image" content="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=A%20modern%20red%20flag%20checker%20app%20interface%20with%20valentine%27s%20theme%2C%20pink%20and%20red%20colors%2C%20heart%20icons%2C%20and%20playful%20design%20on%20a%20gradient%20background&image_size=square" />
    
    <title>Red Flag Checker - Valentine's Edition</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
